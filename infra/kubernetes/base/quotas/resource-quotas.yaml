# Per-namespace ResourceQuotas sized for Phase 1 capacity (PDD §27
# baseline: 1,500 households, 200 providers, 200 daily bookings).
#
# Cluster ceiling: 3× Contabo Cloud VPS L = 24 vCPU / 90 GB / ~2.4 TB
# NVMe combined. We reserve ~20% headroom for system DaemonSets +
# kubelet + control-plane (k3s server) overhead, leaving ~19 vCPU /
# ~72 GB for workloads.
#
# Per-namespace allocations sum to ~17 vCPU requests / ~52 GB requests
# at the requests floor (well within the ~19 vCPU / ~72 GB headroom),
# with burst limits totalling ~38 vCPU / ~104 GB so the cluster can
# absorb short load spikes by overcommitting headroom across namespaces.
#
# When the cluster scales horizontally (TS-150-followup-2 standby +
# eventual additional worker nodes), bump the quotas via per-env
# overlays rather than this base.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-services-quota
  namespace: platform-services
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 24Gi
    limits.cpu: "16"
    limits.memory: 48Gi
    pods: "60"
    services: "30"
    persistentvolumeclaims: "10"
    secrets: "100"
    configmaps: "100"
---
