# Kustomize inflates the NGINX Ingress Controller Helm chart at
# `kustomize build` time. No Helm-operator dependency lives in the
# cluster — ArgoCD (TS-152) or `kustomize build | kubectl apply` is
# enough to roll the manifests.
#
# Per ADR-0001 §"No managed load balancer", NGINX Ingress runs
# in-cluster pinned to one or two edge nodes via `hostPort: 443` +
# `hostPort: 80`, fronted by Cloudflare. The values below pin the
# DaemonSet kind (one ingress pod per labelled node) and disable
# the upstream Service of type LoadBalancer because Contabo has no
# managed LB primitive.
#
# Chart version pinned for reproducibility — bump via PR, not via
# floating `>=` ranges. The CRDs the chart needs (validating
# webhook configurations) install alongside.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NO top-level `namespace:` here (TS-151-followup-22). It reads like the
# right way to place the chart, but a top-level `namespace:` is a
# TRANSFORMER — it rewrites the namespace of every resource this
# kustomization emits, not just the chart's. That swept up both
# NetworkPolicies in `cluster-network-policy.yaml`, which deliberately
# live in `platform-services` and `platform-frontends`; rewriting both to
# `ingress` collapsed them onto the same name/namespace/kind identity and
# kustomize aborted the whole build with an ID conflict.
#
# The effect was total: `kustomize build` failed for base AND for all
# three overlays, so no manifest could be rendered or applied at all.
#
# The chart does not need it — `helmCharts[].namespace` below already
# passes `--namespace ingress` to `helm template`, which is what actually
# places the chart's own resources.

helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.11.3
    releaseName: ingress-nginx
    namespace: ingress
    valuesFile: values.yaml

resources:
  - cluster-network-policy.yaml
