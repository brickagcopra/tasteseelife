# NGINX Ingress Controller Helm values.
#
# Phase 1 posture (ADR-0001 §"No managed load balancer"):
# - DaemonSet on edge-labelled nodes only (kubectl label node <n>
#   taste-and-see.io/role=ingress=true to opt a node in)
# - hostPort:80 + hostPort:443 binds the ingress pod's listeners
#   directly to the node's interface; Cloudflare A records resolve
#   to the node IP
# - No Service of type LoadBalancer (Contabo has no managed LB)
#
# TS-150-followup-4 will add keepalived / floating-IP for ingress
# failover. Until then, edge-node failover is a DNS update.
controller:
  kind: DaemonSet
  hostNetwork: false
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    taste-and-see.io/role-ingress: "true"
  tolerations:
    - key: taste-and-see.io/role-ingress
      operator: Equal
      value: "true"
      effect: NoSchedule
  service:
    enabled: false
  publishService:
    enabled: false
  watchIngressWithoutClass: false
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: k8s.io/ingress-nginx
  config:
    use-forwarded-headers: "true"
    use-proxy-protocol: "false"
    enable-real-ip: "true"
    proxy-real-ip-cidr: 0.0.0.0/0
    server-tokens: "false"
    ssl-protocols: TLSv1.2 TLSv1.3
    ssl-redirect: "true"
    force-ssl-redirect: "true"
    hsts: "true"
    hsts-include-subdomains: "true"
    hsts-max-age: "31536000"
    client-body-buffer-size: 32k
    proxy-body-size: 25m
    keep-alive: "75"
    keep-alive-requests: "1000"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  admissionWebhooks:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 101
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
defaultBackend:
  enabled: false
