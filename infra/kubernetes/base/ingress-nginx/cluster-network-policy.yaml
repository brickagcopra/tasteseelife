# NetworkPolicy carve-out: workload namespaces accept ingress traffic
# from pods labelled `app.kubernetes.io/name=ingress-nginx` in the
# `ingress` namespace. Combined with the default-deny baselines in
# infra/kubernetes/base/network-policies/, this is the only path
# external HTTP reaches a workload pod.
#
# Per-service Ingress resources land in
# infra/kubernetes/services/<svc>/ — the policies below open the
# CHANNEL; the Ingress + Service objects route the request.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-nginx
  namespace: platform-services
  annotations:
    taste-and-see/policy: >-
      Permit ingress-nginx pods to dial any workload pod. The Ingress
      object's `service.name` / `service.port` still has to resolve to
      a matching Service for traffic to flow — this rule only opens
      the network channel.
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-nginx
  namespace: platform-frontends
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
