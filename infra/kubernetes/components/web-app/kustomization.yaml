# Reusable Kustomize Component for a Next.js 15 (App Router) web app.
#
# Shape is identical to nestjs-service except:
# - default port 3000 (Next.js default)
# - default replicas 2 (web apps tend to scale on RPS not CPU)
# - includes an Ingress resource templated for one hostname (overridden
#   per-env)
# - resource requests/limits skew slightly more memory-heavy (Next.js
#   keeps a hotter in-memory cache of RSC outputs)
#
# Consumers (web-marketing / web-family / web-provider / web-admin)
# include this via `components:` + override hostname / namespace /
# image / Ingress annotations.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - service-account.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
  - pod-disruption-budget.yaml
  - horizontal-pod-autoscaler.yaml
  - ingress.yaml
