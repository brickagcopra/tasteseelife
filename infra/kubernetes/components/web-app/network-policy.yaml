# Web apps accept ingress ONLY from the ingress-nginx namespace
# (public traffic via NGINX) — they are not callable directly from
# other workload namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-app
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
