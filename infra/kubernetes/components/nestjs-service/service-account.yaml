# Dedicated ServiceAccount per service. Token automount is OFF
# because the NestJS services do NOT call the Kubernetes API at
# runtime — defence in depth against credential theft via a compromised
# pod. Consumers that DO need API access (operators, admission
# webhooks) override `automountServiceAccountToken: true` in their
# per-service Deployment patch.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nestjs-service
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
