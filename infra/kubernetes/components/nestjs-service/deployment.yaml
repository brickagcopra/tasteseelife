# Stateless NestJS Deployment template.
#
# Security context is set up to satisfy the PSS `restricted` profile
# end-to-end (non-root user, allowPrivilegeEscalation:false,
# readOnlyRootFilesystem:true, drop ALL caps, seccompProfile:
# RuntimeDefault). The base Dockerfile at infra/docker/nestjs.Dockerfile
# runs as UID 1000 / GID 1000 and writes its working set to /app —
# /tmp is mounted as an emptyDir so anything that needs filesystem
# write (e.g. sharp's temp buffers) stays out of the immutable image
# layer.
#
# Per CLAUDE.md §10 + PDD §20.5, `/metrics` is the Prometheus scrape
# target. The annotations below let a standard `prometheus-operator`
# ServiceMonitor (or a static-target scrape job) pick the pods up
# automatically.
#
# Probes:
# - startupProbe gives slow first-boot services (Prisma client warm-up
#   + migration check) up to ~60s before the readiness probe takes
#   over. Without it a service that takes 20s to come up gets killed
#   by the liveness probe before it can answer.
# - readinessProbe + livenessProbe consume /readyz + /healthz — the
#   shape every NestJS service ships from TS-020.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-service
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: nestjs-service
      automountServiceAccountToken: false
      priorityClassName: taste-and-see-workload-standard
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/brickagcopra/nestjs-service:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nestjs-service-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
      tolerations: []
