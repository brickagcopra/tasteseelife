# BullMQ worker Deployment template.
#
# Differences from nestjs-service/deployment.yaml:
# - lower default replicas (1)
# - lower default resources (workers tend to be I/O bound on Redis +
#   Postgres rather than CPU-bound)
# - priorityClassName: batch tier — first to evict under pressure
# - no HTTP probes; workers expose a tiny /healthz on a sidecar-style
#   embedded HTTP listener (BullMQ workers in this codebase ship with
#   a minimal Express handler on PORT for k8s probes — see TS-070
#   onwards). Falls back to a `pgrep node` exec probe when the worker
#   doesn't expose HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bullmq-worker
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: bullmq-worker
      automountServiceAccountToken: false
      priorityClassName: taste-and-see-workload-batch
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/brickagcopra/bullmq-worker:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bullmq-worker-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
