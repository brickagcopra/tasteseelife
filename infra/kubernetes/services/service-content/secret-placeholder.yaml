# Secret PLACEHOLDER for service-content. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-content-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator (the JWT secret must
# be ≥32 chars; the URLs must parse).
#
# Only the three REQUIRED secret-class envs are listed. The two OPTIONAL
# secrets are intentionally absent (Phase-1 posture, see the
# kustomization.yaml header): PAGERDUTY_ROUTING_KEY (unset → paging off,
# escalated ticket still created) and CONCIERGE_TRANSPORTATION_INTERNAL_API_KEY
# (unset → ride-status webhook guard fails closed). The operator adds
# either to this Secret when its upstream integration is provisioned.
apiVersion: v1
kind: Secret
metadata:
  name: service-content-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
