# Secret PLACEHOLDER for worker-search-indexer. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# worker-search-indexer-secrets --from-literal=...` against the
# platform-workers namespace; Phase 2 a SealedSecret replaces this resource
# (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders are deliberately invalid so any pod that booted against them
# would fail fast in the Zod validator (the two API keys must be ≥32 chars;
# REDIS_URL must be a valid redis:// URL).
#
#   - REDIS_URL                          — outbox-consumer Redis connection
#                                          (may carry an ACL password).
#   - PROVIDER_DISCOVERY_INTERNAL_API_KEY — MUST equal service-provider's
#                                          PROVIDER_DISCOVERY_INTERNAL_API_KEY.
#   - SEARCH_INDEX_API_KEY               — MUST equal service-search's
#                                          SEARCH_INDEX_API_KEY.
#
# Base URLs + header names are non-secret and live in the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: worker-search-indexer-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: worker
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  REDIS_URL: redis://REPLACE_ME.platform-data.svc.cluster.local:6379/0
  PROVIDER_DISCOVERY_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  SEARCH_INDEX_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
