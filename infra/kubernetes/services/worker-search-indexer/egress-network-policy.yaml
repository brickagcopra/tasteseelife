# Per-worker egress NetworkPolicy for worker-search-indexer.
#
# The namespace default-deny baseline
# (infra/kubernetes/base/network-policies/default-deny.yaml) denies all
# egress except DNS (allow-dns-egress) and the external data node
# (allow-data-node-egress, which already covers the worker's Redis
# outbox-consumer connection). This worker additionally calls two internal
# HTTP endpoints in the platform-services namespace — service-provider's
# discovery-snapshot (TCP/3014) and service-search's index upsert
# (TCP/3020) — so this additive policy opens exactly those two paths.
#
# The component comment (bullmq-worker/network-policy.yaml) notes that
# per-worker egress (external CIDRs / in-cluster targets) belongs in the
# per-worker base, not the reusable component — this is that override. The
# matching ingress admissions live in the service-provider + service-search
# bases.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-search-indexer-egress-services
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-services
      ports:
        - protocol: TCP
          port: 3014
        - protocol: TCP
          port: 3020
