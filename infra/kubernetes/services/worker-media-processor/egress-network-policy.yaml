# Per-worker egress NetworkPolicy for worker-media-processor.
#
# The namespace default-deny baseline denies all egress except DNS and
# the external data node. This worker calls service-media's internal
# scan-event ingest endpoint in the platform-services namespace, so this
# additive policy opens exactly that one path: TCP/3019 to
# platform-services. The matching ingress admission lives in the
# service-media base.
#
# (Live S3 / ClamAV egress — the media pipeline's external dependencies —
# lands with the live-adapter follow-ups (TS-110-followup-4 / ADR-0002);
# Phase-1 stub adapters need no external egress.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-media-processor-egress-media
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-services
      ports:
        - protocol: TCP
          port: 3019
