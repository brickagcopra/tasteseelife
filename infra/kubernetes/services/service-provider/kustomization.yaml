# Per-service base for service-provider (TS-151-followup-1 rollout).
# Mirrors the canonical service-identity base: consumes the reusable
# nestjs-service component + overrides every placeholder for the
# provider service's specifics (port 3014, env-var contract from
# apps/service-provider/src/config/env.ts, Secret refs for the
# secret-class envs).
#
# The Google Calendar free/busy sync (ADR-0003) is OPTIONAL — every
# GOOGLE_CALENDAR_* / CALENDAR_TOKEN_ENC_KEY field is `.optional()`, so
# they are omitted here and the calendar endpoints return
# `503 calendar_sync_not_configured` until an operator adds them to the
# real Secret / ConfigMap. Checkr config (background checks) IS required.
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, and a handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml
  # TS-151-followup-12 — ArgoCD PreSync hook (wave -10) that applies this
  # service's Prisma migrations before anything else in the sync. Listed ahead
  # of any seed Job below because it must also run ahead of it at apply time.
  - migrate-job.yaml

commonLabels:
  app.kubernetes.io/name: service-provider
  app.kubernetes.io/instance: service-provider
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-provider

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-provider-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3014"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          IDEMPOTENCY_TTL_SECONDS: "86400"
          IDEMPOTENCY_IN_FLIGHT_TTL_SECONDS: "60"
          # TS-305d - outbox CONSUMER cluster. service-provider's FIRST;
          # it has been a producer since TS-050 and listened to nothing.
          # The consumer reads service-booking's lifecycle events to
          # refresh the provider_metrics read model.
          #
          # OUTBOX_CONSUMER_NAME is deliberately ABSENT here - it comes
          # from the downward API on the container env below, because it
          # must differ per pod.
          #
          # OUTBOX_STREAM_PREFIX must match the relay's
          # STREAM_NAME_PREFIX. A mismatch is not an error anywhere: it
          # is a consumer subscribed to a stream nothing writes to, so
          # every provider's metrics read "no bookings yet" for ever.
          OUTBOX_STREAM_PREFIX: events
          OUTBOX_CONSUMER_MAX_ATTEMPTS: "10"
          OUTBOX_CONSUMER_POLL_BLOCK_MS: "5000"
          OUTBOX_CONSUMER_RECLAIM_IDLE_MS: "60000"
          OUTBOX_CONSUMER_POLL_INTERVAL_MS: "1000"
          BACKGROUND_CHECK_PAYLOAD_ENC_KEY_VERSION: "1"
          CHECKR_API_BASE_URL: https://api.checkr.com/v1
          CHECKR_DEFAULT_PACKAGE: tasker_standard
          CHECKR_DEFAULT_WORK_LOCATION_STATES: NY
          CHECKR_REQUEST_TIMEOUT_MS: "10000"
          PROVIDER_DISCOVERY_INTERNAL_HEADER_NAME: x-provider-discovery-internal-api-key
          # TS-042-followup-3a1a — must equal service-notification's copy.
          # Both sides carry the value explicitly rather than relying on
          # matching defaults, because a name mismatch 401s and reads as a
          # rotated secret rather than a typo.
          PROVIDER_BILLING_CONTACTS_INTERNAL_HEADER_NAME: x-provider-billing-contacts-internal-api-key
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-provider
      - op: replace
        path: /spec/ports/0/port
        value: 3014

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-provider
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: service-provider
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/service-provider:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3014
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: service-provider-config
          - secretRef:
              name: service-provider-secrets
      # TS-305d - OUTBOX_CONSUMER_NAME wired to the pod name via the
      # downward API so each replica presents a DISTINCT consumer name in
      # the Redis Streams consumer group. Two pods sharing a name corrupt
      # one another's Pending Entries List, which here means a booking
      # event ACKed by a pod that never projected it - a provider's
      # completion rate silently missing visits, with nothing red
      # anywhere. Set on the container `env` (which wins over the
      # ConfigMap) because a ConfigMap value is identical across replicas
      # by construction. Same wiring as service-trust-safety,
      # service-booking and service-accounting.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OUTBOX_CONSUMER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3014
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3014
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3014
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3014"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-provider
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3014
      # worker-search-indexer (platform-workers) GETs the internal
      # discovery-snapshot endpoint, so admit that namespace in addition
      # to the component default (platform-services).
      - op: add
        path: /spec/ingress/0/from/-
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-workers

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-provider

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-provider
      - op: replace
        path: /spec/scaleTargetRef/name
        value: service-provider
