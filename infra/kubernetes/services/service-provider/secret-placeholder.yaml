# Secret PLACEHOLDER for service-provider. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-provider-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator (the enc key must
# base64-decode to exactly 32 bytes — this does not).
#
# Required secret-class envs (provider boots only when all present):
#   DATABASE_URL, REDIS_URL, JWT_ACCESS_SECRET,
#   BACKGROUND_CHECK_PAYLOAD_ENC_KEY, CHECKR_API_KEY,
#   BACKGROUND_CHECK_WEBHOOK_INTERNAL_API_KEY,
#   PROVIDER_DISCOVERY_INTERNAL_API_KEY,
#   PROVIDER_BILLING_CONTACTS_INTERNAL_API_KEY.
#
# Optional secret-class envs for the Google Calendar free/busy sync
# (ADR-0003). The feature ships dark — when these are absent the
# calendar endpoints return `503 calendar_sync_not_configured`. An
# operator adds them (plus the GOOGLE_CALENDAR_* ConfigMap URLs) to
# light it up. Omitted here so the unconfigured fields stay `undefined`:
#   GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET, GOOGLE_CALENDAR_OAUTH_STATE_SECRET,
#   CALENDAR_TOKEN_ENC_KEY.
type: Opaque
apiVersion: v1
kind: Secret
metadata:
  name: service-provider-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  BACKGROUND_CHECK_PAYLOAD_ENC_KEY: REPLACE_WITH_BASE64_32_BYTE_AES_KEY
  CHECKR_API_KEY: REPLACE_WITH_CHECKR_API_KEY
  BACKGROUND_CHECK_WEBHOOK_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  PROVIDER_DISCOVERY_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  # TS-042-followup-3a1a — must MATCH service-notification's copy. Its own
  # secret rather than reusing the discovery one: a shared secret is a trust
  # principal, and the callers differ (search-indexer vs notification).
  PROVIDER_BILLING_CONTACTS_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
