# Secret PLACEHOLDER for service-academy. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-academy-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator (the JWT secret +
# renewals key must each be ≥32 chars; the URLs must parse).
#
# ACADEMY_CERTIFICATION_RENEWALS_INTERNAL_API_KEY pins the internal
# renewals surface — the certification-renewal worker presents the SAME
# value, so rotating it is a two-side deploy. The renewals HEADER NAME +
# the public cert-verification base URL are non-secret (ConfigMap).
apiVersion: v1
kind: Secret
metadata:
  name: service-academy-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  ACADEMY_CERTIFICATION_RENEWALS_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
