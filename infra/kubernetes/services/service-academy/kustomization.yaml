# Per-service base for service-academy (TS-151-followup-1 rollout,
# Batch 4 — remaining Phase-2/support services). Mirrors the canonical
# service-household base: consumes the reusable nestjs-service component
# + overrides every placeholder for the academy service's specifics
# (port 3022, env-var contract from apps/service-academy/src/config/env.ts,
# Secret refs for the secret-class envs).
#
# Four required secrets (DATABASE_URL, REDIS_URL, JWT_ACCESS_SECRET,
# ACADEMY_CERTIFICATION_RENEWALS_INTERNAL_API_KEY). The renewals key pins
# the internal `/api/v1/internal/academy/certifications/renewals[/…/expire]`
# surface the certification-renewal worker calls — its HEADER NAME is
# non-secret (ConfigMap). ACADEMY_PUBLIC_BASE_URL (the cert-verification
# link origin printed on the PDF) is env-specific and patched per overlay.
#
# NetworkPolicy admits ingress from platform-workers in addition to the
# component default (platform-services): worker-certification-renewal
# (platform-workers, lands in a later batch) POSTs the internal renewals
# endpoints. Admitting the namespace now is harmless before the worker
# ships and avoids a follow-up edit when it does (mirrors the
# service-accounting / service-analytics ingress-admits-workers pattern).
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, ACADEMY_PUBLIC_BASE_URL, and a handful of ConfigMap
# values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml
  # TS-151-followup-12 — ArgoCD PreSync hook (wave -10) that applies this
  # service's Prisma migrations before anything else in the sync. Listed ahead
  # of any seed Job below because it must also run ahead of it at apply time.
  - migrate-job.yaml

commonLabels:
  app.kubernetes.io/name: service-academy
  app.kubernetes.io/instance: service-academy
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-academy

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-academy-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3022"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          IDEMPOTENCY_TTL_SECONDS: "86400"
          IDEMPOTENCY_IN_FLIGHT_TTL_SECONDS: "60"
          ACADEMY_PUBLIC_BASE_URL: https://app.tasteseelife.com
          ACADEMY_CERTIFICATION_RENEWALS_INTERNAL_HEADER_NAME: x-internal-api-key
          # TS-306-followup-1d — this workload now boots the OTel SDK
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both
          # default to true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-academy
      - op: replace
        path: /spec/ports/0/port
        value: 3022

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-academy
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: service-academy
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/service-academy:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3022
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: service-academy-config
          - secretRef:
              name: service-academy-secrets
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3022
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3022
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3022
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3022"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-academy
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3022
      # worker-certification-renewal (platform-workers) POSTs the internal
      # renewals endpoints, so admit that namespace in addition to the
      # component default (platform-services).
      - op: add
        path: /spec/ingress/0/from/-
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-workers

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-academy

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-academy
      - op: replace
        path: /spec/scaleTargetRef/name
        value: service-academy
