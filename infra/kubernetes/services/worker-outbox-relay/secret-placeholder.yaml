# Secret PLACEHOLDER for worker-outbox-relay. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# worker-outbox-relay-secrets --from-literal=...` against the
# platform-workers namespace; Phase 2 a SealedSecret replaces this
# resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders are deliberately invalid so any pod that booted against
# them would fail fast in the Zod validator.
#
# The relay's DATABASE_URL must point at the shared Postgres instance
# with read/update access to EVERY producer schema's outbox_events
# table listed in OUTBOX_SOURCES (Phase-1 single-Postgres, schema-per-
# service). OUTBOX_SOURCES itself is non-secret and lives in the
# ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: worker-outbox-relay-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: worker
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
