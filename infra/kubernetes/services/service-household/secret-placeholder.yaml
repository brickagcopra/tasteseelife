# Secret PLACEHOLDER for service-household. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-household-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator (the two enc keys
# must base64-decode to exactly 32 bytes — these do not).
#
# The two enc-key VERSIONS are non-secret and live in the ConfigMap;
# the two internal shared-secret HEADER NAMES likewise. Only the KEY
# material and the shared-secret VALUES are secret-class.
apiVersion: v1
kind: Secret
metadata:
  name: service-household-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  HOUSEHOLD_INTAKE_ENC_KEY: REPLACE_WITH_BASE64_32_BYTE_AES_KEY
  HOUSEHOLD_ACCESS_ENC_KEY: REPLACE_WITH_BASE64_32_BYTE_AES_KEY
  HOUSEHOLD_VISIT_PREP_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  HOUSEHOLD_MEMBERSHIPS_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  HOUSEHOLD_WELLNESS_SUMMARY_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
