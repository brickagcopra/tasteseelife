# Secret PLACEHOLDER for worker-identity-janitor. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# worker-identity-janitor-secrets --from-literal=...` against the
# platform-workers namespace; Phase 2 a SealedSecret replaces this resource
# (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholder is deliberately invalid so any pod that booted against it
# would fail fast in the Zod validator (DATABASE_URL must be a valid
# postgresql:// URL).
#
# The single secret is the identity-DB connection string. The janitor needs
# DELETE on `identity.refresh_tokens` + `identity.mfa_challenges`; a
# least-privilege role scoped to those two tables is preferable to reusing
# service-identity's full-schema role (defence-in-depth — the janitor never
# reads PII columns, only prunes by `expires_at`).
apiVersion: v1
kind: Secret
metadata:
  name: worker-identity-janitor-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: worker
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: postgresql://REPLACE_ME:REPLACE_ME@postgres.platform-data.svc.cluster.local:5432/identity
