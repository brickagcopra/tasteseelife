# Secret PLACEHOLDER for worker-analytics-aggregator. See the
# service-identity secret-placeholder.yaml header for the full operator
# runbook — Phase 1 the operator runs `kubectl create secret generic
# worker-analytics-aggregator-secrets --from-literal=...` against the
# platform-workers namespace; Phase 2 a SealedSecret replaces this
# resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholder is deliberately invalid so any pod that booted against it
# would fail fast in the Zod validator (the key must be ≥32 chars).
#
# The single secret is the shared API key pinning service-analytics'
# internal search-relevance compute endpoint — it MUST equal
# service-analytics' INTERNAL_AGGREGATION_API_KEY. The base URL + header
# name are non-secret and live in the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: worker-analytics-aggregator-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: worker
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  ANALYTICS_AGGREGATION_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
