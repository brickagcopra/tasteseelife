# Per-service base for service-payouts (TS-151-followup-1 rollout —
# completes the money path begun in Batch 2: accounting + webhook were
# wired then, payouts is the provider-disbursement other half). Mirrors
# the canonical service-identity / service-booking base: consumes the
# reusable nestjs-service component + overrides every placeholder for the
# payouts service's specifics (port 3018, env-var contract from
# apps/service-payouts/src/config/env.ts, Secret refs for the
# secret-class envs).
#
# Plain backend — NO Redis (the env schema declares no REDIS_URL; payouts
# has no Redis-backed idempotency cache), NO outbox consumer, NO downward
# API env. Reached only by in-cluster callers in platform-services:
# - api-gateway proxies the provider-self-service + admin endpoints
# - service-webhook (TS-041a / TS-091) POSTs the down-projected
#   `account.updated` + `transfer.paid` / `transfer.failed` events to the
#   internal ingest routes, guarded by the shared-secret header.
# Both callers live in platform-services, so the component-default
# NetworkPolicy (admit platform-services) covers them — no extra ingress
# admit (unlike service-accounting, which admits platform-workers).
#
# NOT one of PDD §20.2's four critical services (booking / gateway /
# identity / accounting) → standard prod sizing (replicas 3, HPA 3/8, no
# critical priorityClass / PDB bump). The prod overlay patch reflects this.
#
# STRIPE_SECRET_KEY is OPTIONAL in the env schema and is intentionally
# omitted from the Secret placeholder → the Stripe Connect SDK runs in
# stub mode (deterministic synthetic `acct_*` ids + stub onboarding URLs)
# until TS-090-followup-1 lands the live SDK wiring and the operator adds
# the real key.
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, and a handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml
  # TS-151-followup-12 — ArgoCD PreSync hook (wave -10) that applies this
  # service's Prisma migrations before anything else in the sync. Listed ahead
  # of any seed Job below because it must also run ahead of it at apply time.
  - migrate-job.yaml

commonLabels:
  app.kubernetes.io/name: service-payouts
  app.kubernetes.io/instance: service-payouts
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-payouts

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-payouts-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3018"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          STRIPE_API_VERSION: 2024-12-18.acacia
          # Deliberately NOT the real domain, and deliberately left on the
          # reserved `example.com` (TS-151-followup-17). This URL is only ever
          # handed out when Stripe is unconfigured and the service is in stub
          # mode; pointing it at `tasteseelife.com` would dress a dead end up as
          # a real onboarding endpoint, and the first person to follow it would
          # be a provider trying to get paid.
          STRIPE_STUB_ONBOARDING_BASE_URL: https://stub-onboarding.tasteandsee.example.com
          STRIPE_EVENTS_HEADER_NAME: x-internal-api-key
          PAYOUT_HOLD_DAYS: "2"
          PAYOUT_MIN_AMOUNT_MINOR: "100"
          PAYOUT_DEFAULT_CURRENCY: USD
          PAYOUT_TRANSFERS_HEADER_NAME: x-internal-api-key
          # TS-306-followup-1d — this workload now boots the OTel SDK
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both
          # default to true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-payouts
      - op: replace
        path: /spec/ports/0/port
        value: 3018

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-payouts
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: service-payouts
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/service-payouts:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3018
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: service-payouts-config
          - secretRef:
              name: service-payouts-secrets
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3018
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3018
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3018
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3018"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-payouts
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3018

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-payouts

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-payouts
      - op: replace
        path: /spec/scaleTargetRef/name
        value: service-payouts
