# Secret PLACEHOLDER for service-payouts. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-payouts-secrets --from-literal=...` against the target
# namespace BEFORE applying the kustomization; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# The Deployment references `service-payouts-secrets` via
# envFrom.secretRef. If the Secret is missing at apply time the pod
# fails loud (`CreateContainerConfigError`), never silent.
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid (DATABASE_URL is not a
# valid Postgres URL) so any pod that booted against them would fail
# fast in the Zod validator.
#
# Three required secret VALUES per the env schema:
#   - DATABASE_URL                 (z.string().url())
#   - JWT_ACCESS_SECRET            (z.string().min(32))
#   - STRIPE_EVENTS_API_KEY        (z.string().min(32)) — service-webhook
#                                  presents this on the `account.updated`
#                                  internal ingest route
#   - PAYOUT_TRANSFERS_API_KEY     (z.string().min(32)) — service-webhook
#                                  presents this on the `transfer.paid` /
#                                  `transfer.failed` internal ingest route
# Their corresponding header NAMES are non-secret and live in the
# ConfigMap.
#
# NO REDIS_URL: payouts declares no Redis in its env schema (no Redis-
# backed idempotency cache).
#
# STRIPE_SECRET_KEY is intentionally OMITTED: the env schema makes it
# optional and the Stripe Connect SDK runs in STUB mode when absent
# (Phase-1 posture). The operator adds the real key (and onboarding +
# transfers go live) once TS-090-followup-1 lands.
apiVersion: v1
kind: Secret
metadata:
  name: service-payouts-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  STRIPE_EVENTS_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  PAYOUT_TRANSFERS_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
