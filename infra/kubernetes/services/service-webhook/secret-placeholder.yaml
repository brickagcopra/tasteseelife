# Secret PLACEHOLDER for service-webhook. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-webhook-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator (both webhook signing
# secrets must be ≥20 chars; the DATABASE_URL is not a valid Postgres
# URL).
#
# Both signing secrets are REQUIRED — service-webhook refuses to start
# without them (CLAUDE.md §17.8: never ack unsigned webhooks). The
# OPTIONAL dispatch shared secrets (KYC_DISPATCH_API_KEY,
# BACKGROUND_CHECK_DISPATCH_API_KEY) are omitted; they are added together
# with their matching *_DISPATCH_URL when synchronous dispatch is enabled.
apiVersion: v1
kind: Secret
metadata:
  name: service-webhook-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  STRIPE_WEBHOOK_SECRET: REPLACE_WITH_STRIPE_WHSEC_SIGNING_SECRET
  CHECKR_WEBHOOK_SECRET: REPLACE_WITH_CHECKR_WEBHOOK_SIGNING_SECRET
