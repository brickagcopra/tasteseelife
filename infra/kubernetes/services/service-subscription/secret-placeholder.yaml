# Secret PLACEHOLDER for service-subscription. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-subscription-secrets --from-literal=...` against the target
# namespace BEFORE applying the kustomization; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-N).
#
# The Deployment references `service-subscription-secrets` via
# envFrom.secretRef. If the Secret is missing at apply time the pod
# fails loud (`CreateContainerConfigError`), never silent.
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid (DATABASE_URL is not a
# valid Postgres URL) so any pod that booted against them would fail
# fast in the Zod validator.
#
# STRIPE_API_VERSION is NOT a secret and is configured (or, here,
# deliberately omitted to mean "unpinned") via the ConfigMap, not this
# Secret.
apiVersion: v1
kind: Secret
metadata:
  name: service-subscription-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-N).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  STRIPE_SECRET_KEY: REPLACE_WITH_STRIPE_SK
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
