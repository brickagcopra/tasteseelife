# Secret PLACEHOLDER for service-notification. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-notification-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator.
#
# Only the always-required secrets are listed: DATABASE_URL, the JWT
# verification secret, and the render + dispatch shared-secret VALUES.
# The OPTIONAL channel-provider credentials (POSTMARK_SERVER_TOKEN,
# TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN, FIREBASE_SERVICE_ACCOUNT_B64 /
# FIREBASE_PROJECT_ID) are intentionally omitted — each channel adapter
# runs in stub mode until the operator supplies real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: service-notification-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  NOTIFICATION_RENDER_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  NOTIFICATION_DISPATCH_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  # TS-042-followup-3a2 — the dunning ladder. All three are Zod-REQUIRED, so
  # the pod will not boot without them. That is deliberate: a mailer that
  # cannot reach Redis, service-household or service-identity cannot send the
  # ladder at all, and a pod that booted anyway would look healthy while
  # silently telling no family their payment failed.
  #
  # The two shared secrets must MATCH the values held by the services they
  # authenticate to (`HOUSEHOLD_MEMBERSHIPS_INTERNAL_API_KEY` in
  # service-household's Secret, `IDENTITY_RECIPIENT_CONTACTS_API_KEY` in
  # service-identity's) — a mismatch is a 401 on every dunning event, which
  # the consumer redelivers rather than drops.
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  HOUSEHOLD_MEMBERSHIPS_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  # TS-042-followup-3a1a — must MATCH service-provider's
  # PROVIDER_BILLING_CONTACTS_INTERNAL_API_KEY. Required: without it the pod
  # does not boot, which is the intended posture (a booted pod that cannot
  # resolve a provider looks healthy while telling no provider their
  # payment failed).
  PROVIDER_BILLING_CONTACTS_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  IDENTITY_RECIPIENT_CONTACTS_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
