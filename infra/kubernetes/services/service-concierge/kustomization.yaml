# Per-service base for service-concierge (TS-151-followup-1 rollout,
# Batch 4 — remaining Phase-2/support services). Mirrors the canonical
# service-household base: consumes the reusable nestjs-service component
# + overrides every placeholder for the concierge service's specifics
# (port 3021, env-var contract from apps/service-concierge/src/config/env.ts,
# Secret refs for the secret-class envs).
#
# Three required secrets (DATABASE_URL, REDIS_URL, JWT_ACCESS_SECRET).
# Two OPTIONAL secrets are intentionally OMITTED for the Phase-1 posture:
# - PAGERDUTY_ROUTING_KEY — unset → the emergency channel still creates
#   the escalated ticket (the durable source of truth) and logs a warning
#   instead of paging (degrade-gracefully, CLAUDE.md §16). The operator
#   adds it once the on-call PagerDuty service is provisioned.
# - CONCIERGE_TRANSPORTATION_INTERNAL_API_KEY — unset → the inbound
#   ride-status webhook guard fails CLOSED (rejects every POST), which is
#   correct while no Uber/Lyft Health integration posts events (TS-226).
# The PagerDuty endpoint/source/timeout + the transportation HEADER NAME
# are non-secret and ride the ConfigMap.
#
# NetworkPolicy: standard backend (component-default admit of
# platform-services). No platform-workers admit (no worker calls
# concierge). PagerDuty egress (external HTTPS) is not opened here — it is
# unreachable while PAGERDUTY_ROUTING_KEY is unset; a per-service egress
# policy pairs with that key landing (TS-225-followup).
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, and a handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml
  # TS-151-followup-12 — ArgoCD PreSync hook (wave -10) that applies this
  # service's Prisma migrations before anything else in the sync. Listed ahead
  # of any seed Job below because it must also run ahead of it at apply time.
  - migrate-job.yaml

commonLabels:
  app.kubernetes.io/name: service-concierge
  app.kubernetes.io/instance: service-concierge
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-concierge

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-concierge-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3021"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          IDEMPOTENCY_TTL_SECONDS: "86400"
          IDEMPOTENCY_IN_FLIGHT_TTL_SECONDS: "60"
          PAGERDUTY_EVENTS_URL: https://events.pagerduty.com/v2/enqueue
          PAGERDUTY_SOURCE: service-concierge
          PAGERDUTY_TIMEOUT_MS: "5000"
          CONCIERGE_TRANSPORTATION_INTERNAL_HEADER_NAME: x-concierge-transportation-internal-api-key
          # TS-306-followup-1d — this workload now boots the OTel SDK
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both
          # default to true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-concierge
      - op: replace
        path: /spec/ports/0/port
        value: 3021

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-concierge
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: service-concierge
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/service-concierge:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3021
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: service-concierge-config
          - secretRef:
              name: service-concierge-secrets
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3021
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3021
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3021
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3021"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-concierge
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3021

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-concierge

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-concierge
      - op: replace
        path: /spec/scaleTargetRef/name
        value: service-concierge
