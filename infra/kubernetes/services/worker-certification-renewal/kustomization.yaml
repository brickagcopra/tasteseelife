# Per-worker base for worker-certification-renewal (TS-151-followup-1
# rollout, Batch 5 — final web/worker fleet). Consumes the reusable
# bullmq-worker component.
#
# The worker is a daily cross-service aggregator with NO datastore of its
# own (apps/workers/certification-renewal/src/config/env.ts). Each run
# pages service-academy's renewals batch (+ writes lapse `expire`), batches
# recipient contacts from service-identity, and dispatches reminder emails
# through service-notification — three internal hops, each pinned by a
# shared-secret header.
#
# Lives in `platform-workers`. Headless: the bullmq-worker component ships
# NO Service / Ingress / HPA — only /healthz + /readyz for the k8s probes.
# PORT is pinned to the component default 3000 (the probe port) rather than
# the env schema's 3053 default — purely a healthz listener, so matching
# the component avoids per-port patching.
#
# Egress: no Redis, no DB. The three internal HTTP hops cross into
# platform-services — egress-network-policy.yaml opens exactly those paths
# (service-academy:3022, service-identity:3010, service-notification:3017).
# The matching ingress admissions live in those three service bases.
#
# CERTIFICATION_RENEWAL_RENEW_URL is the email CTA link — a cosmetic,
# deployment-specific origin. It is set once here to the production academy
# renewals page and NOT patched per env (Phase-1 notification runs in stub
# mode in dev/staging, so the rendered link is never actually mailed there).
#
# The three shared-secret API keys match the receivers' INTERNAL_API_KEY
# values — rotation is a two-side deploy. Base URLs + header names are
# env-independent and ride the ConfigMap.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-workers

components:
  - ../../components/bullmq-worker

resources:
  - secret-placeholder.yaml
  - egress-network-policy.yaml

commonLabels:
  app.kubernetes.io/name: worker-certification-renewal
  app.kubernetes.io/instance: worker-certification-renewal
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-certification-renewal

  - target:
      kind: ConfigMap
      name: bullmq-worker-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-certification-renewal-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3000"
          SERVICE_VERSION: dev
          # TS-504-followup-2a-2 — this worker now boots the OTel SDK + Sentry
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both OTel
          # flags default true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied. SENTRY_DSN
          # EMPTY = off, and the worker logs that it is off rather than staying quiet.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          SENTRY_DSN: ""
          ACADEMY_SERVICE_BASE_URL: http://service-academy.platform-services.svc.cluster.local:3022
          ACADEMY_CERTIFICATION_RENEWALS_HEADER_NAME: x-internal-api-key
          IDENTITY_SERVICE_BASE_URL: http://service-identity.platform-services.svc.cluster.local:3010
          IDENTITY_RECIPIENT_CONTACTS_HEADER_NAME: x-internal-api-key
          NOTIFICATION_SERVICE_BASE_URL: http://service-notification.platform-services.svc.cluster.local:3017
          NOTIFICATION_DISPATCH_HEADER_NAME: x-internal-api-key
          REQUEST_TIMEOUT_MS: "10000"
          CERTIFICATION_RENEWAL_ENABLED: "true"
          CERTIFICATION_RENEWAL_RUN_HOUR_UTC: "14"
          CERTIFICATION_RENEWAL_SCHEDULER_TICK_MS: "3600000"
          CERTIFICATION_RENEWAL_PAGE_LIMIT: "100"
          CERTIFICATION_RENEWAL_HORIZON_DAYS: "90"
          CERTIFICATION_RENEWAL_RENEW_URL: https://app.tasteseelife.com/academy/renewals
          CERTIFICATION_RENEWAL_APP_NAME: Taste & See

  - target:
      kind: Deployment
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-certification-renewal
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: worker-certification-renewal
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/worker-certification-renewal:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: worker-certification-renewal-config
          - secretRef:
              name: worker-certification-renewal-secrets

  - target:
      kind: NetworkPolicy
      name: bullmq-worker-ingress-deny
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-certification-renewal-ingress-deny

  - target:
      kind: PodDisruptionBudget
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-certification-renewal
