# Per-service base for service-search (TS-151-followup-1 rollout,
# Batch 4 — remaining Phase-2/support services). Mirrors the canonical
# service-household base: consumes the reusable nestjs-service component
# + overrides every placeholder for the search service's specifics
# (port 3020, env-var contract from apps/service-search/src/config/env.ts,
# Secret refs for the secret-class envs).
#
# service-search owns the `search` Postgres schema (ranking config) and
# has NO Redis (the @Idempotent cache is not wired here). It is an outbox
# PRODUCER, not a consumer — it appends `search.performed` rows to its
# own `search.outbox_events` table (the relay drains them), so there is
# NO OUTBOX_CONSUMER_NAME downward-API env; OUTBOX_PRODUCER_SERVICE is a
# non-secret stamp in the ConfigMap.
#
# Elasticsearch is OPTIONAL and intentionally OMITTED for Phase 1 →
# `ELASTICSEARCH_NODE_URL` unset forces the in-memory stub backend
# (TS-111). Live ES wiring + the cluster itself land with TS-111-followup-1
# / TS-151-followup-5. ELASTICSEARCH_TLS_REJECT_UNAUTHORIZED is pinned
# `true` (the env schema's `.superRefine` REJECTS `false` in production,
# CLAUDE.md §3.9). SEARCH_INDEX_API_KEY (required) pins the internal
# upsert/delete + ranking-admin surface.
#
# NetworkPolicy admits ingress from platform-workers in addition to the
# component default: worker-search-indexer (platform-workers, lands in a
# later batch) PUT/DELETEs the internal index surface. Admitting now is
# harmless before the worker ships (mirrors service-accounting /
# service-analytics / service-academy).
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, and a handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml
  # TS-151-followup-12 — ArgoCD PreSync hook (wave -10) that applies this
  # service's Prisma migrations before anything else in the sync. Listed ahead
  # of any seed Job below because it must also run ahead of it at apply time.
  - migrate-job.yaml

commonLabels:
  app.kubernetes.io/name: service-search
  app.kubernetes.io/instance: service-search
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-search

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-search-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3020"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          ELASTICSEARCH_TLS_REJECT_UNAUTHORIZED: "true"
          SEARCH_PROVIDER_INDEX_NAME: providers_v1
          SEARCH_TIER_BOOST_BASIC: "1.0"
          SEARCH_TIER_BOOST_CERTIFIED: "1.2"
          SEARCH_TIER_BOOST_ELITE: "1.5"
          SEARCH_GEO_DECAY_SCALE_KM: "40.2336"
          SEARCH_INDEX_HEADER_NAME: x-internal-api-key
          OUTBOX_PRODUCER_SERVICE: service-search
          # TS-504-followup-2a-3 — this workload boots the OTel SDK
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both default
          # true in the Zod schema; stated here so the enabled posture is visible in
          # the manifest rather than implied.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-search
      - op: replace
        path: /spec/ports/0/port
        value: 3020

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-search
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: service-search
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/service-search:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3020
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: service-search-config
          - secretRef:
              name: service-search-secrets
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3020
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3020
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3020
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3020"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-search
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3020
      # worker-search-indexer (platform-workers) PUT/DELETEs the internal
      # index surface, so admit that namespace in addition to the
      # component default (platform-services).
      - op: add
        path: /spec/ingress/0/from/-
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-workers

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-search

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-search
      - op: replace
        path: /spec/scaleTargetRef/name
        value: service-search
