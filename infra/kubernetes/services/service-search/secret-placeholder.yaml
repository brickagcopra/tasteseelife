# Secret PLACEHOLDER for service-search. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic service-search-secrets
# --from-literal=...`; Phase 2 a SealedSecret replaces this resource
# (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator (the JWT secret +
# index key must each be ≥32 chars; the URL must parse).
#
# Only the three REQUIRED secret-class envs are listed. The optional
# Elasticsearch credentials (ELASTICSEARCH_USERNAME / _PASSWORD /
# _API_KEY) are intentionally absent — Phase 1 runs the in-memory stub
# backend (no ELASTICSEARCH_NODE_URL), so no ES auth is needed until
# TS-111-followup-1 lands the live cluster. SEARCH_INDEX_API_KEY pins the
# internal index + ranking-admin surface (the search-indexer worker
# presents the same value).
apiVersion: v1
kind: Secret
metadata:
  name: service-search-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  SEARCH_INDEX_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
