# Secret PLACEHOLDER for service-analytics. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-analytics-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator (the JWT secret +
# aggregation key must each be ≥32 chars).
#
# INTERNAL_AGGREGATION_API_KEY is the single trust principal pinning the
# `/api/v1/internal/analytics/search-relevance/compute` endpoint — the
# worker-analytics-aggregator presents the SAME value, so rotating it is
# a two-side deploy. The OUTBOX_CONSUMER_NAME (per-pod) + the non-secret
# OUTBOX/JWT config live in the Deployment / ConfigMap, not here.
apiVersion: v1
kind: Secret
metadata:
  name: service-analytics-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_AGGREGATION_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
