# Per-service base for service-analytics (TS-151-followup-1 rollout,
# Batch 3 — observability/analytics cluster). Mirrors the
# service-accounting base (the canonical outbox-consumer shape): consumes
# the reusable nestjs-service component + overrides every placeholder for
# the analytics service's specifics (port 3023, env-var contract from
# apps/service-analytics/src/config/env.ts, Secret refs for the
# secret-class envs).
#
# service-analytics is NOT one of PDD §20.2's four critical services, so
# it takes standard prod sizing (replicas 3 / HPA 3-8, no critical
# priorityClass / resource bump / PDB minAvailable 2).
#
# Two cross-namespace specifics vs a plain backend (same as accounting):
# - OUTBOX_CONSUMER_NAME is wired to the pod name via the downward API
#   (`fieldRef: metadata.name`) so each replica presents a DISTINCT
#   consumer name in the Redis Streams consumer group — the
#   `@taste-and-see/nest-outbox-consumer` SDK requires it (two pods
#   sharing a name corrupt each other's Pending Entries List). Set on the
#   container `env` (which wins over the ConfigMap envFrom) rather than
#   the ConfigMap, which cannot reference the downward API. The service
#   drains `search.performed` + `booking.created` (TS-217-prep-3a).
# - The NetworkPolicy admits ingress from platform-workers in addition to
#   the component default (platform-services): worker-analytics-aggregator
#   (platform-workers) POSTs nightly to
#   `/api/v1/internal/analytics/search-relevance/compute`. Without it
#   that call is dropped. The matching egress lives in the
#   worker-analytics-aggregator base.
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, and a handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml
  # TS-151-followup-12 — ArgoCD PreSync hook (wave -10) that applies this
  # service's Prisma migrations before anything else in the sync. Listed ahead
  # of any seed Job below because it must also run ahead of it at apply time.
  - migrate-job.yaml

commonLabels:
  app.kubernetes.io/name: service-analytics
  app.kubernetes.io/instance: service-analytics
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-analytics

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-analytics-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3023"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          OUTBOX_STREAM_PREFIX: events
          # TS-306-followup-1d — this workload now boots the OTel SDK
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both
          # default to true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-analytics
      - op: replace
        path: /spec/ports/0/port
        value: 3023

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-analytics
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: service-analytics
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/service-analytics:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3023
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: service-analytics-config
          - secretRef:
              name: service-analytics-secrets
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OUTBOX_CONSUMER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3023
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3023
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3023
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3023"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-analytics
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3023
      # The search-relevance aggregator (platform-workers) POSTs to the
      # internal analytics compute endpoint, so admit that namespace in
      # addition to the component default (platform-services).
      - op: add
        path: /spec/ingress/0/from/-
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-workers

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-analytics

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-analytics
      - op: replace
        path: /spec/scaleTargetRef/name
        value: service-analytics
