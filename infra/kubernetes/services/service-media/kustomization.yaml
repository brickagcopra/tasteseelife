# Per-service base for service-media (TS-151-followup-1 rollout, Batch 2
# — billing/payments path). Mirrors the canonical service-identity base:
# consumes the reusable nestjs-service component + overrides every
# placeholder for the media service's specifics (port 3019, env-var
# contract from apps/service-media/src/config/env.ts, Secret refs for the
# secret-class envs).
#
# Two specifics vs a plain backend:
# - S3_BUCKET_NAME is REQUIRED even in stub mode (the stub URL embeds it),
#   so it rides the non-secret ConfigMap; S3_ACCESS_KEY_ID /
#   S3_SECRET_ACCESS_KEY are OPTIONAL and omitted from the Secret →
#   service-media runs the signed-URL issuer in stub mode (Phase-1
#   posture) until the operator supplies real S3 credentials.
# - The NetworkPolicy admits ingress from platform-workers in addition to
#   the component default (platform-services): worker-media-processor
#   (platform-workers) POSTs pipeline stage events to the internal
#   `/api/v1/internal/media/scan-events` route.
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, and a handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml
  # TS-151-followup-12 — ArgoCD PreSync hook (wave -10) that applies this
  # service's Prisma migrations before anything else in the sync. Listed ahead
  # of any seed Job below because it must also run ahead of it at apply time.
  - migrate-job.yaml

commonLabels:
  app.kubernetes.io/name: service-media
  app.kubernetes.io/instance: service-media
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-media

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-media-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3019"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          S3_BUCKET_NAME: taste-and-see-media
          S3_REGION: us-east-1
          S3_FORCE_PATH_STYLE: "false"
          S3_UPLOAD_URL_TTL_SECONDS: "900"
          S3_DELIVERY_URL_TTL_SECONDS: "300"
          MEDIA_SCAN_EVENTS_HEADER_NAME: x-internal-api-key
          # TS-306-followup-1d — this workload now boots the OTel SDK
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both
          # default to true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-media
      - op: replace
        path: /spec/ports/0/port
        value: 3019

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-media
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: service-media
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/service-media:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3019
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: service-media-config
          - secretRef:
              name: service-media-secrets
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3019
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3019
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3019
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3019"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-media
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3019
      # worker-media-processor (platform-workers) POSTs scan-pipeline
      # events to the internal ingest route, so admit that namespace in
      # addition to the component default (platform-services).
      - op: add
        path: /spec/ingress/0/from/-
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-workers

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-media

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-media
      - op: replace
        path: /spec/scaleTargetRef/name
        value: service-media
