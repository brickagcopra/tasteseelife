# Secret PLACEHOLDER for service-media. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-media-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator (S3_SIGNING_SECRET +
# JWT_ACCESS_SECRET must be ≥32 chars; these are not).
#
# S3_SIGNING_SECRET is required even in stub mode (it signs the internal
# presence-proofs embedded in delivery URLs). The live S3 credentials
# (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY) are OPTIONAL and omitted —
# absence forces stub mode (Phase-1 posture). MEDIA_SCAN_EVENTS_API_KEY
# pins the internal scan-events ingest route the media-processor worker
# posts to; the worker presents the same value.
apiVersion: v1
kind: Secret
metadata:
  name: service-media-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  S3_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  MEDIA_SCAN_EVENTS_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
