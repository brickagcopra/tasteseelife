# Secret PLACEHOLDER for service-accounting. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# service-accounting-secrets --from-literal=...`; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator.
#
# STRIPE_SECRET_KEY is intentionally OMITTED: accounting's env schema
# makes it optional and runs the Stripe reconciliation in STUB mode when
# absent (Phase-1 posture, TS-261). The operator adds the real key (and
# the reconciliation goes live) once TS-261-followup-1 lands. The
# INTERNAL_POST_JOURNAL_API_KEY is the single trust principal pinning
# every `/api/v1/internal/*` route — the SaaS-metrics + reconciliation
# workers present the same value, so rotating it is a two-side deploy.
apiVersion: v1
kind: Secret
metadata:
  name: service-accounting-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_POST_JOURNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
