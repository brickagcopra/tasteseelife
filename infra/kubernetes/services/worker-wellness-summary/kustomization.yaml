# Per-worker base for worker-wellness-summary (TS-151-followup-1 rollout,
# Batch 5 — final web/worker fleet). Consumes the reusable bullmq-worker
# component.
#
# The worker is a monthly cross-service aggregator with NO datastore of its
# own (apps/workers/wellness-summary/src/config/env.ts). Each run pages
# service-household's households batch, batches recipient contacts from
# service-identity, pulls the observation summary from service-booking, and
# dispatches the monthly wellness email through service-notification — four
# internal hops, each pinned by a shared-secret header.
#
# Lives in `platform-workers`. Headless: the bullmq-worker component ships
# NO Service / Ingress / HPA — only /healthz + /readyz for the k8s probes.
# PORT is pinned to the component default 3000 (the probe port) rather than
# the env schema's 3052 default — purely a healthz listener, so matching
# the component avoids per-port patching.
#
# Egress: no Redis, no DB. The four internal HTTP hops cross into
# platform-services — egress-network-policy.yaml opens exactly those paths
# (service-household:3011, service-identity:3010, service-booking:3015,
# service-notification:3017). The matching ingress admissions live in those
# four service bases.
#
# The four shared-secret API keys match the receivers' INTERNAL_API_KEY
# values — rotation is a two-side deploy. Base URLs + header names are
# env-independent and ride the ConfigMap.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-workers

components:
  - ../../components/bullmq-worker

resources:
  - secret-placeholder.yaml
  - egress-network-policy.yaml

commonLabels:
  app.kubernetes.io/name: worker-wellness-summary
  app.kubernetes.io/instance: worker-wellness-summary
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-wellness-summary

  - target:
      kind: ConfigMap
      name: bullmq-worker-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-wellness-summary-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3000"
          SERVICE_VERSION: dev
          # TS-504-followup-2a-2 — this worker now boots the OTel SDK + Sentry
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both OTel
          # flags default true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied. SENTRY_DSN
          # EMPTY = off, and the worker logs that it is off rather than staying quiet.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          SENTRY_DSN: ""
          HOUSEHOLD_SERVICE_BASE_URL: http://service-household.platform-services.svc.cluster.local:3011
          HOUSEHOLD_WELLNESS_SUMMARY_INTERNAL_HEADER_NAME: x-internal-api-key
          IDENTITY_SERVICE_BASE_URL: http://service-identity.platform-services.svc.cluster.local:3010
          IDENTITY_RECIPIENT_CONTACTS_HEADER_NAME: x-internal-api-key
          BOOKING_SERVICE_BASE_URL: http://service-booking.platform-services.svc.cluster.local:3015
          BOOKING_WELLNESS_SUMMARY_INTERNAL_HEADER_NAME: x-internal-api-key
          NOTIFICATION_SERVICE_BASE_URL: http://service-notification.platform-services.svc.cluster.local:3017
          NOTIFICATION_DISPATCH_HEADER_NAME: x-internal-api-key
          REQUEST_TIMEOUT_MS: "10000"
          WELLNESS_SUMMARY_ENABLED: "true"
          WELLNESS_SUMMARY_WINDOW_DAYS: "30"
          WELLNESS_SUMMARY_RUN_DAY_OF_MONTH: "1"
          WELLNESS_SUMMARY_RUN_HOUR_UTC: "13"
          WELLNESS_SUMMARY_SCHEDULER_TICK_MS: "3600000"
          WELLNESS_SUMMARY_HOUSEHOLD_PAGE_LIMIT: "100"
          WELLNESS_SUMMARY_APP_NAME: Taste & See

  - target:
      kind: Deployment
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-wellness-summary
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: worker-wellness-summary
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/worker-wellness-summary:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: worker-wellness-summary-config
          - secretRef:
              name: worker-wellness-summary-secrets

  - target:
      kind: NetworkPolicy
      name: bullmq-worker-ingress-deny
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-wellness-summary-ingress-deny

  - target:
      kind: PodDisruptionBudget
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-wellness-summary
