# Secret PLACEHOLDER for worker-wellness-summary. See the service-identity
# secret-placeholder.yaml header for the full operator runbook — Phase 1
# the operator runs `kubectl create secret generic
# worker-wellness-summary-secrets --from-literal=...` against the
# platform-workers namespace; Phase 2 a SealedSecret replaces this resource
# (TS-151-followup-2).
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders are deliberately invalid so any pod that booted against them
# would fail fast in the Zod validator (each API key must be ≥32 chars).
#
# One shared secret per internal hop — each MUST equal the receiver's value:
#   - HOUSEHOLD_WELLNESS_SUMMARY_INTERNAL_API_KEY → service-household's
#     wellness-summary internal key.
#   - IDENTITY_RECIPIENT_CONTACTS_API_KEY         → service-identity's
#     recipient-contacts internal key.
#   - BOOKING_WELLNESS_SUMMARY_INTERNAL_API_KEY   → service-booking's
#     wellness-summary internal key.
#   - NOTIFICATION_DISPATCH_API_KEY               → service-notification's
#     dispatch internal key.
#
# Base URLs + header names are non-secret and live in the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: worker-wellness-summary-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: worker
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-2).
type: Opaque
stringData:
  HOUSEHOLD_WELLNESS_SUMMARY_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  IDENTITY_RECIPIENT_CONTACTS_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  BOOKING_WELLNESS_SUMMARY_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  NOTIFICATION_DISPATCH_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
