# Per-service base for api-gateway (TS-151-followup-1 rollout).
# Mirrors the canonical service-identity base shape: consumes the
# reusable nestjs-service component + overrides every placeholder for
# the gateway's specifics (name, port 3000, env-var contract from
# apps/api-gateway/src/config/env.ts).
#
# The gateway is special vs the data-owning services:
# - NO DATABASE_URL — it owns no Postgres schema; it is a routing +
#   auth-verify + rate-limit + aggregation surface only.
# - The downstream `*_SERVICE_BASE_URL` values are in-cluster Service
#   DNS names (env-independent) and therefore live in the ConfigMap,
#   not the Secret. Only SUBSCRIPTION_SERVICE_BASE_URL is required by
#   the env schema; the rest are optional and configured as the
#   downstream services come online (incremental rollout).
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, and a handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml

commonLabels:
  app.kubernetes.io/name: api-gateway
  app.kubernetes.io/instance: api-gateway
  app.kubernetes.io/part-of: taste-and-see

# Strategic + JSON 6902 patches rename every resource emitted by the
# nestjs-service component from `nestjs-service` to `api-gateway` AND
# override the component defaults with gateway specifics (port 3000,
# the non-secret env from apps/api-gateway/src/config/env.ts, Secret
# refs for the secret-class envs).
patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: api-gateway

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: api-gateway-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3000"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          RATE_LIMIT_DEFAULT_WINDOW_SECONDS: "60"
          RATE_LIMIT_DEFAULT_MAX_REQUESTS: "120"
          RATE_LIMIT_SENSITIVE_WINDOW_SECONDS: "300"
          RATE_LIMIT_SENSITIVE_MAX_REQUESTS: "20"
          DOWNSTREAM_REQUEST_TIMEOUT_MS: "5000"
          # Every downstream the gateway's env schema declares (TS-505d2-followup-4).
          # The list was previously six, dating from the incremental rollout when
          # most of these workloads did not exist yet — but the fleet has been 31
          # deployable workloads since TS-300-followup-2, and each of these is
          # `.optional()` in the schema, so a missing one does NOT fail boot: the
          # gateway returns 503 `not_configured` from `DownstreamHttpClient`. On a
          # cluster that meant provider search, every accounting admin surface, the
          # whole trust & safety console, concierge, academy, ads, media, audit,
          # analytics, notification and payouts all answered 503 with a healthy
          # gateway and eleven healthy pods behind it.
          #
          # Ports are each service's OWN in-cluster port (its base's ConfigMap
          # `PORT` and Service `port`, which agree), NOT the schema default in
          # `apps/service-*/src/config/env.ts`. The two deliberately differ for
          # booking — 3015 here, 3027 locally since TS-504-followup-1 — because in
          # k8s every pod has its own network namespace and the DNS name
          # disambiguates, while locally the whole fleet shares one host. The guard
          # in `packages/testing/src/boot/gateway-downstream-config.test.ts` checks
          # each URL against the owning service's manifest, so a drift here is
          # caught against the right authority.
          SUBSCRIPTION_SERVICE_BASE_URL: http://service-subscription.platform-services.svc.cluster.local:3012
          IDENTITY_SERVICE_BASE_URL: http://service-identity.platform-services.svc.cluster.local:3010
          HOUSEHOLD_SERVICE_BASE_URL: http://service-household.platform-services.svc.cluster.local:3011
          PROVIDER_SERVICE_BASE_URL: http://service-provider.platform-services.svc.cluster.local:3014
          BOOKING_SERVICE_BASE_URL: http://service-booking.platform-services.svc.cluster.local:3015
          CONTENT_SERVICE_BASE_URL: http://service-content.platform-services.svc.cluster.local:3025
          ACCOUNTING_SERVICE_BASE_URL: http://service-accounting.platform-services.svc.cluster.local:3015
          AUDIT_SERVICE_BASE_URL: http://service-audit.platform-services.svc.cluster.local:3016
          NOTIFICATION_SERVICE_BASE_URL: http://service-notification.platform-services.svc.cluster.local:3017
          PAYOUTS_SERVICE_BASE_URL: http://service-payouts.platform-services.svc.cluster.local:3018
          MEDIA_SERVICE_BASE_URL: http://service-media.platform-services.svc.cluster.local:3019
          SEARCH_SERVICE_BASE_URL: http://service-search.platform-services.svc.cluster.local:3020
          CONCIERGE_SERVICE_BASE_URL: http://service-concierge.platform-services.svc.cluster.local:3021
          ACADEMY_SERVICE_BASE_URL: http://service-academy.platform-services.svc.cluster.local:3022
          ANALYTICS_SERVICE_BASE_URL: http://service-analytics.platform-services.svc.cluster.local:3023
          ADS_SERVICE_BASE_URL: http://service-ads.platform-services.svc.cluster.local:3024
          TRUST_SAFETY_SERVICE_BASE_URL: http://service-trust-safety.platform-services.svc.cluster.local:3026
          HOUSEHOLD_VISIT_PREP_INTERNAL_HEADER_NAME: x-household-visit-prep-internal-api-key
          # TS-505d2-followup-5 — household tenant-scope resolution. The header
          # name must match service-household's ConfigMap exactly; the value
          # lives in the Secret. The TTL bounds how long a REVOKED membership
          # keeps working, so it is a security parameter, not a cache knob.
          HOUSEHOLD_MEMBERSHIPS_INTERNAL_HEADER_NAME: x-household-memberships-internal-api-key
          HOUSEHOLD_SCOPE_CACHE_TTL_SECONDS: "60"
          SEARCH_INDEX_HEADER_NAME: x-internal-api-key
          # TS-306-followup-1d — this workload now boots the OTel SDK
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both
          # default to true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: api-gateway
      - op: replace
        path: /spec/ports/0/port
        value: 3000

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: api-gateway
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: api-gateway
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/api-gateway:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3000
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: api-gateway-config
          - secretRef:
              name: api-gateway-secrets
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3000
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3000
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3000
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3000"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: api-gateway
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3000
      # The gateway is the BFF the web apps (platform-frontends) call
      # server-side, so it must admit ingress from that namespace in
      # addition to the component default (platform-services). Without
      # this, web-family → gateway RSC/server-action fetches are dropped.
      - op: add
        path: /spec/ingress/0/from/-
        value:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-frontends

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: api-gateway

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: api-gateway
      - op: replace
        path: /spec/scaleTargetRef/name
        value: api-gateway
