# Secret PLACEHOLDER for api-gateway. See the service-identity
# secret-placeholder.yaml header for the full operator runbook —
# Phase 1 the operator runs `kubectl create secret generic
# api-gateway-secrets --from-literal=...` against the target
# namespace BEFORE applying the kustomization; Phase 2 a SealedSecret
# replaces this resource (TS-151-followup-N).
#
# The Deployment references `api-gateway-secrets` via envFrom.secretRef.
# If the Secret is missing at apply time the pod fails loud
# (`CreateContainerConfigError`), never silent.
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives here. The
# placeholders below are deliberately invalid so any pod that booted
# against them would fail fast in the Zod validator.
#
# Required secret-class envs (api-gateway boots only when all present):
#   REDIS_URL, JWT_ACCESS_SECRET, INTERNAL_TRUST_SIGNING_SECRET.
#
# Optional secret-class envs the operator MAY add to the real Secret to
# light up the gated endpoints (the gateway boots without them and the
# dependent endpoint returns 503 when called):
#   HOUSEHOLD_VISIT_PREP_INTERNAL_API_KEY  (TS-208 visit-prep aggregator)
#   HOUSEHOLD_MEMBERSHIPS_INTERNAL_API_KEY (TS-505d2-followup-5 household tenant
#                                          scope. NOT really optional in
#                                          practice: without it NO request can
#                                          obtain a household scope, so the
#                                          family dashboard, wellness surfaces,
#                                          concierge and report-a-concern all
#                                          refuse. The gateway logs one WARN at
#                                          startup saying exactly this.)
#   SEARCH_INDEX_API_KEY                   (TS-211-followup-1 admin ranking proxy)
# They are omitted from this placeholder so the un-configured field
# stays `undefined` (optional) rather than carrying a garbage value.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-N).
type: Opaque
stringData:
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
