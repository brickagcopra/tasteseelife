# Per-worker base for worker-accounting-metrics (TS-151-followup-1
# rollout, Batch 2 — billing/payments path). Consumes the reusable
# bullmq-worker component. The worker is a thin nightly scheduler with NO
# datastore of its own (TS-260): once a day it makes one shared-secret-
# pinned internal call to service-accounting's
# `POST /api/v1/internal/accounting/saas-metrics/compute`, which owns the
# ledger read + the money math.
#
# Lives in `platform-workers`. Headless: the bullmq-worker component
# ships NO Service / Ingress / HPA — the worker runs on a scheduler tick
# and exposes only /healthz + /readyz for the k8s probes. PORT is pinned
# to the component's default 3000 (the probe port) rather than the env
# schema's 3053 default — purely a healthz listener, so matching the
# component avoids per-port patching.
#
# Egress: the worker calls service-accounting in platform-services, which
# the namespace default-deny blocks by default — egress-network-policy.yaml
# opens exactly that path (platform-services:3015). The accounting base in
# turn admits ingress from platform-workers.
#
# The internal API key matches service-accounting's
# INTERNAL_POST_JOURNAL_API_KEY (the single trust principal for every
# /api/v1/internal/* route) — rotation is a two-side deploy. The base URL
# + header name are env-independent and ride the non-secret ConfigMap.
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag and a
# handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-workers

components:
  - ../../components/bullmq-worker

resources:
  - secret-placeholder.yaml
  - egress-network-policy.yaml

commonLabels:
  app.kubernetes.io/name: worker-accounting-metrics
  app.kubernetes.io/instance: worker-accounting-metrics
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-accounting-metrics

  - target:
      kind: ConfigMap
      name: bullmq-worker-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-accounting-metrics-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3000"
          SERVICE_VERSION: dev
          # TS-504-followup-2a-2 — this worker now boots the OTel SDK + Sentry
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both OTel
          # flags default true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied. SENTRY_DSN
          # EMPTY = off, and the worker logs that it is off rather than staying quiet.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          SENTRY_DSN: ""
          ACCOUNTING_SERVICE_BASE_URL: http://service-accounting.platform-services.svc.cluster.local:3015
          ACCOUNTING_SAAS_METRICS_INTERNAL_HEADER_NAME: x-accounting-internal-api-key
          REQUEST_TIMEOUT_MS: "30000"
          ACCOUNTING_METRICS_ENABLED: "true"
          ACCOUNTING_METRICS_RUN_HOUR_UTC: "2"
          ACCOUNTING_METRICS_SCHEDULER_TICK_MS: "3600000"

  - target:
      kind: Deployment
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-accounting-metrics
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: worker-accounting-metrics
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/worker-accounting-metrics:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: worker-accounting-metrics-config
          - secretRef:
              name: worker-accounting-metrics-secrets

  - target:
      kind: NetworkPolicy
      name: bullmq-worker-ingress-deny
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-accounting-metrics-ingress-deny

  - target:
      kind: PodDisruptionBudget
      name: bullmq-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: worker-accounting-metrics
