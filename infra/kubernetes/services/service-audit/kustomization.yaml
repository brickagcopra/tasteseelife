# Per-service base for service-audit (TS-151-followup-1 rollout, Batch 3
# — observability/analytics cluster). Mirrors the canonical
# service-identity / service-household base: consumes the reusable
# nestjs-service component + overrides every placeholder for the audit
# service's specifics (port 3016, env-var contract from
# apps/service-audit/src/config/env.ts, Secret refs for the secret-class
# envs).
#
# Phase 1 the audit hot window lives in Postgres (`DATABASE_URL`); the
# Cassandra cold tier (PDD §8.2 / §17.1) is a later wiring. A single
# internal-ingest shared secret (`AUDIT_INGEST_API_KEY`) pins the
# `/api/v1/internal/audit/events` route every cross-service producer
# POSTs to; its HEADER NAME is non-secret and rides the ConfigMap. The
# producers all live in platform-services, which the component-default
# ingress NetworkPolicy already admits — no platform-workers admission
# needed here (contrast service-analytics, which the aggregator worker
# calls).
#
# Env overlays in infra/kubernetes/overlays/<env>/ patch image tag,
# replica count, and a handful of ConfigMap values per env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-services

components:
  - ../../components/nestjs-service

resources:
  - secret-placeholder.yaml
  # TS-151-followup-12 — ArgoCD PreSync hook (wave -10) that applies this
  # service's Prisma migrations before anything else in the sync. Listed ahead
  # of any seed Job below because it must also run ahead of it at apply time.
  - migrate-job.yaml

commonLabels:
  app.kubernetes.io/name: service-audit
  app.kubernetes.io/instance: service-audit
  app.kubernetes.io/part-of: taste-and-see

patches:
  - target:
      kind: ServiceAccount
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-audit

  - target:
      kind: ConfigMap
      name: nestjs-service-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-audit-config
      - op: replace
        path: /data
        value:
          NODE_ENV: production
          LOG_LEVEL: info
          PORT: "3016"
          SERVICE_VERSION: dev
          JWT_ISSUER: taste-and-see/service-identity
          JWT_AUDIENCE: taste-and-see/api
          INTERNAL_TRUST_MAX_AGE_SECONDS: "60"
          AUDIT_INGEST_HEADER_NAME: x-internal-api-key
          IDEMPOTENCY_TTL_SECONDS: "86400"
          IDEMPOTENCY_IN_FLIGHT_TTL_SECONDS: "60"
          # TS-306-followup-1d — this workload now boots the OTel SDK
          # (`src/observability/bootstrap.ts`, first import in main.ts). Both
          # default to true in the Zod schema; stated here so the enabled
          # posture is visible in the manifest rather than implied.
          OTEL_TRACES_ENABLED: "true"
          OTEL_METRICS_ENABLED: "true"
          # TS-504-followup-2a — Sentry error reporting (CLAUDE.md §10).
          # EMPTY = off, and the service logs that it is off rather than
          # staying quiet. The real DSN is supplied per env by the overlay or
          # the operator; it is not committed, and it is not a Secret
          # placeholder because a REPLACE_WITH_ value is not a valid URL and
          # would fail Zod boot on every workload that does not use Sentry.
          SENTRY_DSN: ""

  - target:
      kind: Service
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-audit
      - op: replace
        path: /spec/ports/0/port
        value: 3016

  - target:
      kind: Deployment
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-audit
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: service-audit
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/brickagcopra/service-audit:replace-me
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3016
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: service-audit-config
          - secretRef:
              name: service-audit-secrets
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 3016
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 3016
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 3016
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "3016"

  - target:
      kind: NetworkPolicy
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-audit
      - op: replace
        path: /spec/ingress/0/ports/0/port
        value: 3016

  - target:
      kind: PodDisruptionBudget
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-audit

  - target:
      kind: HorizontalPodAutoscaler
      name: nestjs-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: service-audit
      - op: replace
        path: /spec/scaleTargetRef/name
        value: service-audit
