# Secret PLACEHOLDER. The base ships an empty Secret with literal
# `<FILL_IN_OPERATOR>` values so `kustomize build` produces a
# self-consistent manifest stream but `kubectl apply` of this Secret
# alone would be obviously wrong if it ever landed in a cluster.
#
# Per env, the operator either:
# (a) Phase 1 — runs `kubectl create secret generic service-identity-secrets
#     --from-literal=DATABASE_URL=... --from-literal=...` against the
#     target namespace BEFORE applying the kustomization, then deletes
#     this placeholder from the overlay's `resources:` list, OR
# (b) once sealed-secrets / external-secrets lands (TS-151-followup-N),
#     the per-env overlay replaces this resource with a SealedSecret
#     wrapping the encrypted ciphertext.
#
# The Deployment in service-identity/kustomization.yaml references
# `service-identity-secrets` via `envFrom.secretRef`. If the Secret is
# missing at apply time the pod will not start (`CreateContainerConfigError`)
# — the failure mode is loud, not silent.
#
# Per CLAUDE.md §3.5 / §17.12 no real credential ever lives in a
# committed file. The placeholders below are deliberately invalid
# (DATABASE_URL is not a valid Postgres URL) so any pod that did boot
# against them would fail fast in the Zod validator.
apiVersion: v1
kind: Secret
metadata:
  name: service-identity-secrets
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: backend
  annotations:
    taste-and-see/secret-source: >-
      Phase 1: operator-managed via `kubectl create secret`. Phase 2:
      sealed-secrets / external-secrets (TS-151-followup-N).
type: Opaque
stringData:
  DATABASE_URL: REPLACE_WITH_REAL_DATABASE_URL
  REDIS_URL: REPLACE_WITH_REAL_REDIS_URL
  JWT_ACCESS_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  INTERNAL_TRUST_SIGNING_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  MFA_TOTP_ENC_KEY: REPLACE_WITH_BASE64_32_BYTE_AES_KEY
  MFA_CHALLENGE_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTER_HMAC_SECRET
  STRIPE_SECRET_KEY: REPLACE_WITH_STRIPE_SK
  STRIPE_IDENTITY_RETURN_URL: REPLACE_WITH_HTTPS_URL
  KYC_PAYLOAD_ENC_KEY: REPLACE_WITH_BASE64_32_BYTE_AES_KEY
  KYC_WEBHOOK_INTERNAL_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  # Shared secrets for the two internal, header-pinned routes. Both are
  # REQUIRED by the Zod validator, so a pod without them fails at boot —
  # which is the intended failure mode, but only if the key is here to be
  # filled in. Distinct values per route on purpose: they hand out
  # different things (a batch of emails vs everything identity holds about
  # one person) to different workloads.
  IDENTITY_RECIPIENT_CONTACTS_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
  IDENTITY_PRIVACY_EXPORT_API_KEY: REPLACE_WITH_AT_LEAST_32_CHARACTER_SHARED_SECRET
