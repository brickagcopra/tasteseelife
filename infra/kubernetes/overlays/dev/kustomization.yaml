# Dev environment overlay.
#
# Per ADR-0001, Phase 1 dev runs against the same Contabo k3s
# cluster as staging / prod (single-cluster, namespace-scoped
# isolation per env happens via a future TS-151-followup that
# spins up `dev-*` / `staging-*` / `prod-*` namespace pairs).
# For TS-151's first cut, dev / staging / prod each target the
# full canonical namespace topology — operators apply ONE overlay
# per cluster.
#
# Dev tweaks vs base:
# - replicas: 1 (lowest cost; no HA needed)
# - image tag: `dev` (latest passing CI)
# - LE issuer: letsencrypt-staging (untrusted certs, no rate-limit risk)
# - hostname: dev.tasteseelife.com
# - data-node host: dev VLAN IP (patched on data-access ExternalName)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../services/service-identity
  - ../../services/api-gateway
  - ../../services/service-subscription
  - ../../services/service-booking
  - ../../services/service-household
  - ../../services/service-provider
  - ../../services/worker-outbox-relay
  - ../../services/web-family
  - ../../services/web-marketing
  - ../../services/service-accounting
  - ../../services/service-notification
  - ../../services/service-media
  - ../../services/service-webhook
  - ../../services/worker-accounting-metrics
  - ../../services/worker-stripe-reconciliation
  - ../../services/worker-media-processor
  - ../../services/service-payouts
  - ../../services/service-audit
  - ../../services/service-activity
  - ../../services/service-analytics
  - ../../services/worker-analytics-aggregator
  - ../../services/service-messaging
  - ../../services/service-concierge
  - ../../services/service-academy
  - ../../services/service-search
  - ../../services/web-admin
  - ../../services/web-provider
  - ../../services/worker-search-indexer
  - ../../services/worker-identity-janitor
  - ../../services/worker-certification-renewal
  - ../../services/worker-wellness-summary
  - ../../services/service-ads
  - ../../services/service-content
  - ../../services/service-trust-safety

# ── Single-node resource profile (TS-151-followup-13) ────────────────
#
# Dev is one 8-vCPU box. `replicas: 1` below is necessary but NOT
# sufficient: rendered, the 34 workload Deployments request ~7.15 cores
# / 7.88 GiB, and the Helm-inflated platform stack (kube-prometheus,
# Loki, Tempo, Grafana, ingress-nginx, cert-manager, sealed-secrets)
# adds roughly 2 more cores and 4+ GiB. Requests are a scheduling
# floor, not a usage estimate, so without this component the tail of
# the fleet sits `Pending`/`Insufficient cpu` indefinitely while every
# Deployment cheerfully reports healthy replicas of zero — a failure
# that reads as a hang because nothing has actually crashed.
#
# The component cuts REQUESTS only (cpu -> 50m, memory -> 192Mi) and
# leaves LIMITS untouched, so burst headroom under real load is
# unchanged. Applied here and NOT in staging/prod, where ADR-0001's
# three-node topology makes it the wrong trade.
#
# Expect: cpu 7.15 -> ~1.7 cores, memory 7.88 -> ~6.0 GiB.
components:
  - ../../components/single-node

# No top-level namespace — this overlay spans multiple namespaces
# and each child resource carries its own.

patches:
  # ── Data-node egress CIDR (TS-151-followup-22) ────────────────────
  #
  # Base ships the Contabo private-VLAN default `10.40.0.0/24`. The dev
  # box has no such VLAN: it is a single-node k3s install, and the data
  # services it must reach (Postgres 16, Redis) are addressed on the
  # flannel pod network, `10.42.0.0/16`.
  #
  # This is the failure mode the CIDR being wrong produces: every pod
  # starts, passes its liveness probe, and then fails every query — the
  # NetworkPolicy silently drops egress to 5432/6379 and nothing in the
  # pod's own status reflects it. Patched here rather than edited in
  # base because `infra/kubernetes/README.md` §2 designates the CIDR
  # overlay-overridable, and staging/prod legitimately differ.
  #
  # No `namespace:` on the target: the same policy name exists in
  # platform-services, platform-workers AND platform-frontends, and all
  # three need the same CIDR. Omitting it patches all three; naming one
  # would fix a third of the fleet and leave the rest silently broken.
  - target:
      kind: NetworkPolicy
      name: allow-data-node-egress
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/cidr
        value: 10.42.0.0/16

  - target:
      kind: Service
      name: postgres-primary
      namespace: platform-data
    patch: |-
      - op: replace
        path: /spec/externalName
        value: postgres.dev.internal

  - target:
      kind: Service
      name: redis-primary
      namespace: platform-data
    patch: |-
      - op: replace
        path: /spec/externalName
        value: redis.dev.internal

  # ── Grafana Ingress (TS-151-followup-6) ────────────────────────────
  - target:
      kind: Ingress
      name: grafana
      namespace: observability
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: grafana.dev.tasteseelife.com
      - op: replace
        path: /spec/rules/0/host
        value: grafana.dev.tasteseelife.com

  - target:
      kind: Deployment
      name: service-identity
      namespace: platform-services
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: service-identity
      namespace: platform-services
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  - target:
      kind: ConfigMap
      name: service-identity-config
      namespace: platform-services
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: development
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      - op: replace
        path: /data/JWT_AUDIENCE
        value: taste-and-see/api/dev
      - op: replace
        path: /data/SERVICE_VERSION
        value: dev

