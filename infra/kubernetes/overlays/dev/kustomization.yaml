  # Image pinning for dev.
  #
  # The TS-009g per-service build workflow rewrites `newTag` to the
  # `sha-<short-sha>` of the building commit on every push to `main` that
  # touches service-identity. The `:dev` default below is the fallback for
  # bootstrap (before the first build lands) and for `kustomize build`
  # rendering from a clean clone.
  #
  # Why a kustomize `images:` directive and not a JSON patch?
  # - One field for the workflow to update vs. a multi-line patch string
  # - Kustomize's image-name-keyed override applies to every Deployment that
  #   references `ghcr.io/brickagcopra/service-identity:*`, so future workers
  #   that consume the same image (e.g. a one-off seed Job) inherit the bump
  #   without per-workload edits
  # - The override is documented as the GitOps-canonical pattern in
  #   `infra/docker/README.md` "CI integration" so future per-service rollouts
  #   (TS-151-followup-1) wire the same shape
  # -- service-ads (TS-300-followup-2) ---------------------------------
  - target:
      kind: Deployment
      name: service-ads
      namespace: platform-services
    patch: |-
