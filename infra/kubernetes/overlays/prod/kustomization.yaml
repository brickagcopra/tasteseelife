# Production environment overlay.
#
# Prod tweaks vs base:
# - replicas: 3 (PDB minAvailable=1 means 2 always remain through a
#   rolling deploy)
# - image tag: `prod` (or pinned SHA via ArgoCD when TS-152 lands)
# - LE issuer: letsencrypt-prod (real trusted certs)
# - hostname: tasteseelife.com
# - resource asks bumped via the per-service patch to the higher tier
# - PodDisruptionBudget minAvailable bumped to 2 for service-identity
#   (one of the four critical services per PDD §20.2)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../services/service-identity
  - ../../services/api-gateway
  - ../../services/service-subscription
  - ../../services/service-booking
  - ../../services/service-household
  - ../../services/service-provider
  - ../../services/worker-outbox-relay
  - ../../services/web-family
  - ../../services/web-marketing
  - ../../services/service-accounting
  - ../../services/service-notification
  - ../../services/service-media
  - ../../services/service-webhook
  - ../../services/worker-accounting-metrics
  - ../../services/worker-stripe-reconciliation
  - ../../services/worker-media-processor
  - ../../services/service-payouts
  - ../../services/service-audit
  - ../../services/service-activity
  - ../../services/service-analytics
  - ../../services/worker-analytics-aggregator
  - ../../services/service-messaging
  - ../../services/service-concierge
  - ../../services/service-academy
  - ../../services/service-search
  - ../../services/web-admin
  - ../../services/web-provider
  - ../../services/worker-search-indexer
  - ../../services/worker-identity-janitor
  - ../../services/worker-certification-renewal
  - ../../services/worker-wellness-summary
  - ../../services/service-ads
  - ../../services/service-content
  - ../../services/service-trust-safety

patches:
  - target:
      kind: Service
      name: postgres-primary
      namespace: platform-data
    patch: |-
      - op: replace
        path: /spec/externalName
        value: postgres.prod.internal

  - target:
      kind: Service
      name: redis-primary
      namespace: platform-data
    patch: |-
      - op: replace
        path: /spec/externalName
        value: redis.prod.internal

  - target:
      kind: ClusterIssuer
      name: letsencrypt-staging
    patch: |-
      - op: replace
        path: /spec/acme/email
        value: ops@tasteseelife.com

  - target:
      kind: ClusterIssuer
      name: letsencrypt-prod
    patch: |-
      - op: replace
        path: /spec/acme/email
        value: ops@tasteseelife.com

  # ── Grafana Ingress (TS-151-followup-6) — real trusted cert ────────
  - target:
      kind: Ingress
      name: grafana
      namespace: observability
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: replace
        path: /spec/tls/0/hosts/0
        value: grafana.tasteseelife.com
      - op: replace
        path: /spec/rules/0/host
        value: grafana.tasteseelife.com

  - target:
      kind: Deployment
      name: service-identity
      namespace: platform-services
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/priorityClassName
        value: taste-and-see-workload-critical
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi

  - target:
      kind: HorizontalPodAutoscaler
      name: service-identity
      namespace: platform-services
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 8

  - target:
      kind: PodDisruptionBudget
      name: service-identity
      namespace: platform-services
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2

  - target:
      kind: ConfigMap
      name: service-identity-config
      namespace: platform-services
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: production
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      - op: replace
        path: /data/JWT_AUDIENCE
        value: taste-and-see/api
      - op: replace
        path: /data/SERVICE_VERSION
        value: prod

