# Staging environment overlay.
#
# Staging is the production-parity testbed: same replica count + same
# resource sizing as prod, just pointed at the staging Stripe test
# mode + staging data node + a staging.tasteseelife.com hostname.
#
# Per CLAUDE.md §11, the soak window between staging promote and prod
# promote is the trust gate for releases. Staging therefore tracks
# every prod change before prod sees it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../services/service-identity
  - ../../services/api-gateway
  - ../../services/service-subscription
  - ../../services/service-booking
  - ../../services/service-household
  - ../../services/service-provider
  - ../../services/worker-outbox-relay
  - ../../services/web-family
  - ../../services/web-marketing
  - ../../services/service-accounting
  - ../../services/service-notification
  - ../../services/service-media
  - ../../services/service-webhook
  - ../../services/worker-accounting-metrics
  - ../../services/worker-stripe-reconciliation
  - ../../services/worker-media-processor
  - ../../services/service-payouts
  - ../../services/service-audit
  - ../../services/service-activity
  - ../../services/service-analytics
  - ../../services/worker-analytics-aggregator
  - ../../services/service-messaging
  - ../../services/service-concierge
  - ../../services/service-academy
  - ../../services/service-search
  - ../../services/web-admin
  - ../../services/web-provider
  - ../../services/worker-search-indexer
  - ../../services/worker-identity-janitor
  - ../../services/worker-certification-renewal
  - ../../services/worker-wellness-summary
  - ../../services/service-ads
  - ../../services/service-content
  - ../../services/service-trust-safety

patches:
  - target:
      kind: Service
      name: postgres-primary
      namespace: platform-data
    patch: |-
      - op: replace
        path: /spec/externalName
        value: postgres.staging.internal

  - target:
      kind: Service
      name: redis-primary
      namespace: platform-data
    patch: |-
      - op: replace
        path: /spec/externalName
        value: redis.staging.internal

  # ── Grafana Ingress (TS-151-followup-6) ────────────────────────────
  # staging keeps the letsencrypt-staging issuer (base default).
  - target:
      kind: Ingress
      name: grafana
      namespace: observability
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: grafana.staging.tasteseelife.com
      - op: replace
        path: /spec/rules/0/host
        value: grafana.staging.tasteseelife.com

  - target:
      kind: Deployment
      name: service-identity
      namespace: platform-services
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: HorizontalPodAutoscaler
      name: service-identity
      namespace: platform-services
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4

  - target:
      kind: ConfigMap
      name: service-identity-config
      namespace: platform-services
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: staging
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      - op: replace
        path: /data/JWT_AUDIENCE
        value: taste-and-see/api/staging
      - op: replace
        path: /data/SERVICE_VERSION
        value: staging

  # ── api-gateway (TS-151-followup-1) ────────────────────────────────
  - target:
      kind: Deployment
      name: api-gateway
      namespace: platform-services
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
