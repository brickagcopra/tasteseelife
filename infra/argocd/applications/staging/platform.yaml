# Child Application: staging/platform — twin of dev/platform.
#
# Same auto-sync + prune + selfHeal posture as dev. Staging soak-time is
# enforced by NOT promoting the source revision (the prod overlay's image
# tags only flip after the staging soak passes); this Application syncs the
# manifest at HEAD as soon as a PR lands.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-staging
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: taste-and-see
    tastesee.io/env: staging
    tastesee.io/role: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging

  source:
    repoURL: https://github.com/brickagcopra/tasteseelife.git
    path: infra/kubernetes/overlays/staging
    targetRevision: main
    kustomize:
      commonAnnotations:
        argocd.argoproj.io/tracking-id: platform-staging:argoproj.io/Application:argocd/platform-staging

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-services

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
      - Replace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /spec/tls/0/hosts
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/metrics
