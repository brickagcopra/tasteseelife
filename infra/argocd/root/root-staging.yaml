# Root Application for staging — twin of root-dev.
#
# Same auto-sync + prune + selfHeal policy as dev. The staging-vs-prod
# differentiation lives at the leaf Applications (applications/staging/* vs
# applications/prod/*), not at the root level.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-staging
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: taste-and-see
    tastesee.io/env: staging
    tastesee.io/role: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-staging

  source:
    repoURL: https://github.com/brickagcopra/tasteseelife.git
    path: infra/argocd/applications/staging
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
