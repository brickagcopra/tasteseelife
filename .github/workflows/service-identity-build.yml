# Per-service build pipeline for `service-identity`.
#
# Triggered on push to `main` when any of the following change:
#   - apps/service-identity/**         (the service itself)
#   - packages/**                       (workspace deps the service imports)
#   - pnpm-lock.yaml                    (dep graph change anywhere)
#   - infra/docker/**                   (Dockerfile / README touch)
#   - .github/workflows/service-identity-build.yml  (self-update)
#   - .github/workflows/build-push-image.yml        (reusable workflow update)
#
# The build is intentionally NOT a pull-request gate. PRs go through the
# main `.github/workflows/ci.yml` for the cheap checks (lint / type-check /
# test / bundle / filesystem trivy / semgrep). Spinning a full image build
# on every PR commit would add ~3-5 min and pollute ghcr.io with throwaway
# tags. Build-on-PR is captured as TS-009g-followup-3 once the registry
# noise is worth the early-validation signal.
#
# What happens on a push to main that touches this service:
#   1. The reusable `build-push-image.yml` workflow builds, pushes, signs,
#      and scans a fresh image tagged `sha-<short-sha>` + `main`.
#   2. The `bump-dev-overlay` job rewrites
#      `infra/kubernetes/overlays/dev/kustomization.yaml`'s `newTag:` field
#      to the freshly-built `sha-<short-sha>` and commits back to main.
#   3. ArgoCD's `platform-dev` Application auto-syncs from main and rolls
#      the dev cluster onto the new tag — usually within 1-2 min of the
#      bumper commit landing.
#
# Staging and prod overlays are NOT auto-bumped. Promotion is operator-
# driven via a deliberate PR per CLAUDE.md §11 + PDD §11 soak-then-promote;
# see TS-009g-followup-2 for the promotion-PR workflow shape.
#
# References:
#   PDD.md §20.4 (CI/CD), §11 (deployment gates)
#   CLAUDE.md §11 (CI/CD & branching)

name: service-identity build

on:
  push:
    branches: [main]
    paths:
      - "apps/service-identity/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "infra/docker/**"
      - ".github/workflows/service-identity-build.yml"
      - ".github/workflows/build-push-image.yml"

  # Manual trigger (TS-009g-followup-8). Two cases it exists for:
  #   - Path filtering is unreliable on a repository FIRST commit, so an
  #     initial import can land with no image built and no way to ask for one
  #     short of an empty commit that fakes a path match.
  #   - Re-running a build after a transient registry or Trivy failure.
  workflow_dispatch:

# Cancel superseded runs on the same branch so we don't accidentally
# auto-bump dev to an older SHA after a flurry of merges.
concurrency:
  group: build-service-identity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Caller MUST repeat the permissions the reusable workflow's job declares
    # — GitHub takes the intersection of caller + callee permissions, and
    # omitting any of these here would silently strip them from the inner job.
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/build-push-image.yml
    with:
      service-name: service-identity
      service-path: apps/service-identity
      service-package: "@taste-and-see/service-identity"
      image-name: ghcr.io/brickagcopra/service-identity
      migrator-image-name: ghcr.io/brickagcopra/service-identity-migrator

  bump-dev-overlay:
    name: Bump dev overlay `newTag`
    needs: build
    # Dispatch can run from any branch; `push` could only ever be main. This
    # job checks out main, rewrites the dev overlay, and pushes a commit to
    # main — so without this guard a dispatch from a feature branch would put
    # an unreviewed build into dev, via the trunk.
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    # 15 not 5 (TS-151-followup-24): a 34-way fan-out serialises these
    # pushes, and the retry loop below needs room to wait its turn.
    timeout-minutes: 15
    permissions:
      # `contents: write` is the load-bearing privilege — without it the
      # bumper can't push back to main. Everything else stays read.
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # We push back to main from this job; the checkout needs the same
          # ref to keep the working copy aligned with what we'll push.
          ref: main
          # `persist-credentials: true` (the default) leaves the
          # GITHUB_TOKEN-backed remote configured so `git push` works without
          # explicit auth setup.
          persist-credentials: true

      # Bump, commit and push in ONE step, re-deriving on every attempt
      # (TS-151-followup-24).
      #
      # A push touching `packages/**` or `pnpm-lock.yaml` matches all 34
      # per-service path filters, so 34 of these jobs run concurrently, each
      # rewriting a DIFFERENT `newTag:` line in the SAME file and racing to
      # push to main. The first wins; the rest are rejected non-fast-forward.
      # Not theoretical: commit d2feac6 fanned out to 34 builds, all 34 image
      # jobs passed, and 12 bumpers died exactly this way.
      #
      # `git pull --rebase` is NOT a sufficient fix. The `images:` entries are
      # two lines each, packed back to back, so neighbouring services' `newTag:`
      # lines sit 2 lines apart — inside git's default 3-line diff context — and
      # concurrent rebases of adjacent entries conflict.
      #
      # So every attempt RE-DERIVES from a fresh main instead of replaying a
      # patch: fetch, hard-reset, re-run the rewrite, commit, push. The edit is
      # idempotent and line-scoped, so re-deriving after someone else's push is
      # always correct and can never conflict.
      - name: Bump overlay tag, commit & push
        env:
          NEW_TAG: ${{ needs.build.outputs.image-sha-tag }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          SOURCE_SHA: ${{ github.sha }}
          # github-actions[bot]'s no-reply email — keeps the commit author
          # bound to the bot identity GitHub uses for token-attributed pushes.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          overlay='infra/kubernetes/overlays/dev/kustomization.yaml'

          for attempt in $(seq 1 50); do
            # FETCH_HEAD rather than origin/main: unambiguous regardless of
            # how the checkout configured its remote-tracking refspec.
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD

            # The kustomize `images:` directive is the only place the dev tag
            # lives (TS-009g refactor). The pattern is anchored to THIS
            # service's image entry to stay surgical — touching any other
            # `newTag:` line would be a bug. Where the service owns a Prisma
            # schema the pattern also admits the `-migrator` suffix, so the
            # one-shot `prisma migrate deploy` image is bumped to the SAME sha
            # in the same commit (TS-151-followup-12): a release whose migrator
            # lagged its service would apply last release's migrations and then
            # roll code that needs this one.
            #
            # awk rather than sed because GNU sed and BSD sed disagree on
            # in-place edit syntax (`-i` vs `-i ''`), and the runners are Ubuntu
            # today but the recipe also needs to work for local operator
            # dry-runs on macOS.
            awk -v new_tag="${NEW_TAG}" '
              BEGIN { pending = 0 }
              /^[[:space:]]*-[[:space:]]*name:[[:space:]]*ghcr\.io\/brickagcopra\/service-identity(-migrator)?[[:space:]]*$/ {
                pending = 1
                print
                next
              }
              pending == 1 && /^[[:space:]]*newTag:[[:space:]]*/ {
                sub(/newTag:[[:space:]]*.*/, "newTag: " new_tag)
                pending = 0
                print
                next
              }
              { print }
            ' "${overlay}" > "${overlay}.next"
            mv "${overlay}.next" "${overlay}"

            if git diff --quiet -- "${overlay}"; then
              echo "Overlay already pins ${NEW_TAG}; nothing to push."
              exit 0
            fi

            git add "${overlay}"
            # `[skip ci]` keeps the bumper from triggering ci.yml against its
            # own commit. The bumper does NOT match this workflow's path
            # filters (it only touches `infra/kubernetes/overlays/dev/`), so the
            # self-trigger loop is already structurally impossible — the marker
            # is belt-and-braces against future path-filter drift.
            git commit --quiet \
              -m "ci(service-identity): bump dev overlay to ${NEW_TAG} [skip ci]" \
              -m "Source commit: ${SOURCE_SHA}" \
              -m "Image digest: ${IMAGE_DIGEST}"

            if git push --quiet origin HEAD:main; then
              echo "Pushed service-identity -> ${NEW_TAG} on attempt ${attempt}."
              exit 0
            fi

            echo "Attempt ${attempt}: push rejected (a concurrent bumper won the race); re-deriving against fresh main."
            sleep "$(( (attempt % 3) + 1 ))"
          done

          echo "FATAL: could not push the overlay bump for service-identity after 50 attempts."
          exit 1
